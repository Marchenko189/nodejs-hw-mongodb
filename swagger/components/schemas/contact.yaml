# swagger/components/schemas/contact.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380675254532'
  email:
    description: "Contact's email"
    type: string
    example: 'qwerty123@gmail.com'
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Indicates whether the contact is marked as favourite'
    type: boolean
    example: false
  userId:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    format: binary
